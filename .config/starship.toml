format = "$directory$git_branch$git_status$line_break$character"
right_format = "$cmd_duration"

[directory]
format = "[$path]($style) "
style = "fg:#6699AA"
truncation_length = 3

[git_branch]
format = "[$branch]($style) "
style = "fg:#888888"

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "fg:#888888"
ahead = "↑\u200B"
behind = "↓\u200B"
diverged = "↕\u200B"
modified = "~\u200B"
staged = "+\u200B"
deleted = "-\u200B"
untracked = "?\u200B"

[character]
success_symbol = "[❯](fg:#4a8a4a)"
error_symbol = "[❯](fg:#8a4a4a)"

[cmd_duration]
min_time = 2000
format = "[$duration]($style)"
style = "fg:#888888"
